name: Tests and package
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin zip make python3
      - name: Test
        run: make test
      - name: Build extension
        run: make pack
      - name: Build EGO preview
        run: make pack-production
      - uses: actions/upload-artifact@v4
        with:
          name: tilero-shell-extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tilero-ego-preview
          path: dist/*.ego.zip
          if-no-files-found: error
